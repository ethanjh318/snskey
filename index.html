<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
      :root {
        --bg-1: #020617;
        --bg-2: #111827;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-border: rgba(148, 163, 184, 0.35);
        --text: #e2e8f0;
        --accent: #7c3aed;
        --accent-2: #22d3ee;
        --snake: #4ade80;
        --food: #f97316;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(124, 58, 237, 0.25), transparent 30%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .game-shell {
        width: min(90vw, 640px);
        padding: 22px;
        border-radius: 26px;
        background: var(--panel);
        border: 3px solid var(--panel-border);
        box-shadow:
          0 0 0 2px rgba(255,255,255,0.06),
          0 18px 60px rgba(0,0,0,0.45),
          inset 0 0 20px rgba(255,255,255,0.04);
        backdrop-filter: blur(10px);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        padding: 10px 8px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.4rem);
        letter-spacing: 0.08em;
      }

      .score {
        font-weight: 700;
        color: #facc15;
        font-size: 1.1rem;
      }

      .board-wrap {
        display: grid;
        place-items: center;
        padding-top: 8px;
      }

      canvas {
        width: min(85vw, 500px);
        height: auto;
        border-radius: 18px;
        background: rgba(2, 6, 23, 0.8);
        border: 2px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 0 18px rgba(34, 211, 238, 0.08);
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        box-shadow: 0 8px 18px rgba(124, 58, 237, 0.28);
      }

      .status {
        margin-top: 14px;
        text-align: center;
        min-height: 24px;
        color: #cbd5e1;
        font-size: 0.98rem;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <h1>SNKEY</h1>
        <div class="score">Score: <span id="score">0</span></div>
      </div>

      <div class="board-wrap">
        <canvas id="gameCanvas" width="420" height="420"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn">Start / Restart</button>
      </div>

      <div id="status" class="status">Press Start to begin.</div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');

      const gridSize = 21;
      const tileSize = canvas.width / gridSize;

      let snake = [];
      let direction = { x: 1, y: 0 };
      let nextDirection = { x: 1, y: 0 };
      let food = { x: 5, y: 5 };
      let score = 0;
      let gameLoop = null;
      let gameOver = false;

      function resetGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        gameOver = false;
        scoreEl.textContent = '0';
        spawnFood();
        statusEl.textContent = 'Game running...';
      }

      function spawnFood() {
        const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
        const freeCells = [];

        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            if (!occupied.has(`${x},${y}`)) freeCells.push({ x, y });
          }
        }

        if (freeCells.length === 0) {
          gameOver = true;
          statusEl.textContent = 'You win!';
          clearInterval(gameLoop);
          return;
        }

        food = freeCells[Math.floor(Math.random() * freeCells.length)];
      }

      function update() {
        if (gameOver) return;

        direction = nextDirection;

        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        if (
          head.x < 0 ||
          head.x >= gridSize ||
          head.y < 0 ||
          head.y >= gridSize ||
          snake.some(seg => seg.x === head.x && seg.y === head.y)
        ) {
          gameOver = true;
          statusEl.textContent = 'Game over! Press Start / Restart.';
          clearInterval(gameLoop);
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = String(score);
          spawnFood();
          statusEl.textContent = 'Nice!';
        } else {
          snake.pop();
        }
      }

      function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            ctx.fillStyle = (x + y) % 2 === 0 ? 'rgba(15, 23, 42, 0.95)' : 'rgba(15, 23, 42, 0.75)';
            ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
          }
        }

        ctx.fillStyle = '#f97316';
        ctx.fillRect(food.x * tileSize + 4, food.y * tileSize + 4, tileSize - 8, tileSize - 8);

        snake.forEach((segment, index) => {
          ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e';
          ctx.fillRect(
            segment.x * tileSize + 2,
            segment.y * tileSize + 2,
            tileSize - 4,
            tileSize - 4
          );
        });
      }

      function tick() {
        update();
        drawBoard();
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();

        if (key === 'w' || key === 'arrowup') {
          if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
        }
        if (key === 's' || key === 'arrowdown') {
          if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
        }
        if (key === 'a' || key === 'arrowleft') {
          if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
        }
        if (key === 'd' || key === 'arrowright') {
          if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
        }
      });

      startBtn.addEventListener('click', () => {
        clearInterval(gameLoop);
        resetGame();
        drawBoard();
        gameLoop = setInterval(tick, 120);
      });

      resetGame();
      drawBoard();
    </script>
  </body>
</html>
